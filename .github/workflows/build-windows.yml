name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Test CLI
        run: npm test

      - name: Build Windows executable
        run: npm run build:win

      - name: Smoke-test executable
        run: .\dist\node-cli-starter.exe --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-cli-starter-windows-x64
          path: dist/node-cli-starter.exe
          if-no-files-found: error
