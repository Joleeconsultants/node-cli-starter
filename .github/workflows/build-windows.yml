name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Test CLI
        run: npm test

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }

      - name: Build Windows executable
        run: npm run build:win

      - name: Smoke-test executable
        run: .\dist\node-cli-starter.exe --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-cli-starter-windows-x64
          path: dist/node-cli-starter.exe
          if-no-files-found: error


  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v8
        with:
          name: node-cli-starter-windows-x64
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/node-cli-starter.exe
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
